<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文章なおし</title>
  <meta name="theme-color" content="#2e5e4e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 名前と版の番号（スマホで新しい版になったか、ここで分かる） -->
  <header class="header">
    <p class="header_title">文章なおし</p>
    <p class="header_version"></p>
  </header>

  <!-- 打つ所 -->
  <section class="writer">
    <div class="writer_inner">
      <label class="writer_title" for="source_text">送りたい文</label>
      <button class="writer_clear" type="button">消す</button>
    </div>
    <textarea id="source_text" class="writer_input" autocomplete="off" rows="5" placeholder="ここに打つ（声でもOK）"></textarea>
  </section>

  <!-- 直し方のボタン（押すとすぐ Gemini に頼む） -->
  <section class="mode">
    <p class="mode_title">どう直す？</p>
    <div class="mode_list">
      <button class="mode_item" type="button" data-mode="funny">面白く</button>
      <button class="mode_item" type="button" data-mode="polite">ていねい</button>
      <button class="mode_item" type="button" data-mode="soft">やわらかく</button>
      <button class="mode_item" type="button" data-mode="short">短く</button>
      <button class="mode_item" type="button" data-mode="typo">誤字だけ</button>
    </div>
  </section>

  <!-- 直した文（手で少し直してから送れる） -->
  <section class="result">
    <p class="result_title">直した文</p>
    <p class="result_status" aria-live="polite"></p>
    <textarea id="result_text" class="result_output" autocomplete="off" rows="5" placeholder="ボタンを押すと、ここに出ます"></textarea>
    <div class="result_inner">
      <button class="result_send" type="button">LINEで送る</button>
      <button class="result_copy" type="button">コピー</button>
      <button class="result_retry" type="button">もう一回</button>
    </div>
  </section>

  <!-- 設定（Gemini の鍵）。鍵が無いときは開いた状態で出す -->
  <details class="setting">
    <summary class="setting_title">設定（Gemini の鍵）</summary>
    <label class="setting_label" for="api_key">Gemini API キー</label>
    <input id="api_key" class="setting_input" type="password" autocomplete="off" placeholder="AIza…">
    <button class="setting_save" type="button">保存</button>
    <p class="setting_description">鍵はこのスマホの中にだけ保存します。無料の鍵だと、送った文が Google のサービス改善に使われることがあります。</p>
  </details>

  <script src="app.js"></script>
</body>
</html>
